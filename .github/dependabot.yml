version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
        update-types:
          - "patch"
      next-runtime:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
        update-types:
          - "patch"
      vitest-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "patch"
      tailwind-tooling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Jerusalem"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
